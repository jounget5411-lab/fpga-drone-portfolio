<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc"><title id="title">FPGA 영상 처리와 SNN 구조</title><desc id="desc">카메라, 영상 전처리, 144개 공간 블록과 20프레임 윈도, SNN 144-8-2, AXI GPIO와 C++ UART 진단 흐름을 나타냅니다. CNN 확장 연결은 블록 설계에 포함되며 이 도식은 SNN 주 경로에 집중합니다. CNN 실행 검증은 별도입니다.</desc><rect x="0" y="0" width="1600" height="1110" rx="0" fill="#F4F6F8" opacity="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#49DBD2" opacity="1"/><text x="72" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="17" fill="#101C2D" font-weight="700" letter-spacing="2" text-anchor="start">01  /  SYSTEM OVERVIEW</text><text x="1528" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="1" text-anchor="end">FPGA / VISION / SNN</text><text x="68" y="135" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="45" fill="#101C2D" font-weight="700" letter-spacing="-1" text-anchor="start">영상에서 특징으로, 특징에서 추론으로</text><text x="72" y="182" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">FPGA 영상 처리·SNN 소스에서 확인한 구성과 결과 확인 경로</text><line x1="72" y1="212" x2="1528" y2="212" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="72" y="257" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="700" letter-spacing="1.5" text-anchor="start">01</text><text x="116" y="257" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="23" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">주요 처리 단계</text><rect x="72" y="287" width="340" height="280" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="94" y="308" width="38" height="30" rx="7" fill="#49DBD2" opacity="1"/><text x="113" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">01</text><text x="94" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">카메라 입력</text><text x="94" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">OV5640 / Pcam</text><line x1="94" y1="428" x2="390" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="94" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">영상 프레임 입력</text><text x="94" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">카메라·FPGA 인터페이스</text><rect x="444" y="287" width="340" height="280" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="466" y="308" width="38" height="30" rx="7" fill="#49DBD2" opacity="1"/><text x="485" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">02</text><text x="466" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">영상 전처리</text><text x="466" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">VIDEO PREPROCESSING</text><line x1="466" y1="428" x2="762" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="466" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">160 × 90 그레이스케일</text><text x="466" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">프레임 차분</text><rect x="816" y="287" width="340" height="280" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="838" y="308" width="38" height="30" rx="7" fill="#49DBD2" opacity="1"/><text x="857" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">03</text><text x="838" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">시간·공간 특징</text><text x="838" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">FEATURE EXTRACTOR</text><line x1="838" y1="428" x2="1134" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="838" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">16 × 9 = 144 공간 블록</text><text x="838" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">블록별 3비트 카운트</text><text x="838" y="523" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">20프레임 순환 윈도</text><rect x="1188" y="287" width="340" height="280" rx="16" fill="#101C2D" opacity="1"/><rect x="1210" y="308" width="38" height="30" rx="7" fill="#49DBD2" opacity="1"/><text x="1229" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">04</text><text x="1210" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#F6F8FA" font-weight="700" letter-spacing="0" text-anchor="start">SNN 추론</text><text x="1210" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#49DBD2" font-weight="500" letter-spacing="0" text-anchor="start">SPIKING NEURAL NETWORK</text><line x1="1210" y1="428" x2="1506" y2="428" stroke="#35465B" stroke-width="1" opacity="1"/><text x="1210" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#BDCADA" font-weight="400" letter-spacing="0" text-anchor="start">144 → 8 → 2 구조</text><text x="1210" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#BDCADA" font-weight="400" letter-spacing="0" text-anchor="start">특징 입력에 대한 분류</text><line x1="412" y1="428" x2="437" y2="428" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 430 422 L 438 428 L 430 434" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="784" y1="428" x2="809" y2="428" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 802 422 L 810 428 L 802 434" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="1156" y1="428" x2="1181" y2="428" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1174 422 L 1182 428 L 1174 434" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="1358" y1="567" x2="1358" y2="626" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1352 619 L 1358 627 L 1364 619" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="72" y="620" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="700" letter-spacing="1.5" text-anchor="start">02</text><text x="116" y="620" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="23" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">결과 확인 및 구현 범위</text><rect x="72" y="650" width="670" height="265" rx="12" fill="#E8EDF2" opacity="1"/><rect x="92" y="674" width="4" height="25" rx="2" fill="#49DBD2" opacity="1"/><text x="109" y="696" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">RTL에서 확인되는 핵심</text><text x="96" y="739" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">프레임 차분과 블록 집계로 입력 특징 구성</text><text x="96" y="771" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">시간 정보를 순환 버퍼에 저장</text><text x="96" y="803" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">SNN 가중치·추론 로직을 하드웨어로 구현</text><rect x="774" y="650" width="754" height="265" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><text x="800" y="695" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="25" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">결과 읽기 → 진단 출력</text><rect x="800" y="727" width="255" height="74" rx="10" fill="#E8F5F3" opacity="1"/><text x="927" y="772" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="25" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">AXI GPIO</text><line x1="1067" y1="764" x2="1099" y2="764" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1092 758 L 1100 764 L 1092 770" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="1114" y="727" width="384" height="74" rx="10" fill="#E8EDF2" opacity="1"/><text x="1306" y="772" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="25" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">C++ / UART</text><text x="800" y="850" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">추론 결과를 소프트웨어에서 읽고 확인</text><text x="800" y="881" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="18" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">구현 구조를 설명하며 성능 측정값을 뜻하지 않음</text><text x="72" y="965" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">구분해 읽기</text><text x="228" y="965" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="18" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">CNN 확장 연결은 블록 설계에 포함됩니다. 이 도식은 SNN 주 경로에 집중하며 CNN 실행 검증은 별도입니다.</text><line x1="72" y1="1027" x2="1528" y2="1027" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="72" y="1067" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">CODE-BASED DIAGRAM  ·  실제 영상·시험 결과가 아닌 소스 구조 설명</text><text x="1528" y="1067" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="15" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="end">SOURCE SNAPSHOT  206404b</text></svg>